[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# NOTE: Railway does not always expand `$PORT` unless executed via a shell.
startCommand = "sh -c \"gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:${PORT:-8000} --timeout 120 --access-logfile - --error-logfile -\""
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
